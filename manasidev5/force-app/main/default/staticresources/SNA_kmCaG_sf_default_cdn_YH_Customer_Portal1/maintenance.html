:root {

    --yh-purple: #34215a;

    --body-size: 14px;

    /* 24pt - 2x body size */

}

<script>
   (function() {
        var scrollListenerAttached = false;

        function initBannerScroll() {
            var checkExist = setInterval(function() {
                var scrollContainer = document.querySelector('.body.isPageWidthFixed-true');
                var heroBanner = document.querySelector('div.hero');
                var header = document.querySelector('div.themeBgImage'); 
                var mainContent = document.querySelector('.body.isPageWidthFixed-true .comm-content-header');

                if (scrollContainer && heroBanner) {
                    clearInterval(checkExist);
                    var lastScrollTop = 0;

                    // Remove old listener if it exists to prevent duplicates
                    scrollContainer.removeEventListener('scroll', handleScroll);
                    scrollContainer.addEventListener('scroll', handleScroll, { passive: true });
                }
                
                function handleScroll() {
                    var st = scrollContainer.scrollTop;
                    // Target the blocking region you identified
                    var blockingRegion = document.querySelector('div.hero');

                    if (st > lastScrollTop && st > 50) {
                        // Hiding the banner
                        heroBanner.style.transform = 'translateY(-600px)';
                        heroBanner.style.opacity = '0';
                        header.style.backgroundColor = '#34215a';
                        mainContent.style.top = '50px'; 
                        
                        // ADD THIS: Make the blocking region "pass-through"
                        //if (blockingRegion) blockingRegion.style.pointerEvents = 'none';
                        
                    } else {
                        // Showing the banner
                        heroBanner.style.transform = 'translateY(0)';
                        heroBanner.style.opacity = '1';
                        header.style.backgroundColor = 'transparent';
                        mainContent.style.top = '250px'; 
                        
                        // ADD THIS: Re-enable clicks when visible
                        //if (blockingRegion) blockingRegion.style.pointerEvents = 'auto';
                    }
                    lastScrollTop = st <= 0 ? 0 : st;
                }
            }, 500);
        }

        initBannerScroll();
        window.addEventListener('popstate', initBannerScroll);
        var pushState = history.pushState;
        history.pushState = function() {
            pushState.apply(history, arguments);
            initBannerScroll();
        };
    })();
</script>

<script>
(function () {
    function isValidEmail(value) {
        value = value.trim();
        // Basic email structure
        const emailRegex =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
        // Must match regex
        if (!emailRegex.test(value)) {
            return false;
        }
        // Reject consecutive dots
        if (value.includes('..')) {
            return false;
        }
        // Split local/domain
        const parts = value.split('@');
        // Must contain exactly one @
        if (parts.length !== 2) {
            return false;
        }
        const local = parts[0];
        const domain = parts[1];
        // Reject leading/trailing dots
        if (
            local.startsWith('.') ||
            local.endsWith('.') ||
            domain.startsWith('.') ||
            domain.endsWith('.')
        ) {
            return false;
        }
        return true;
    }

    function getInput() {
        return document.querySelector(
            'input[placeholder="Username"], input[placeholder="Email address"]'
        );
    }

    function removeMessage() {
        const existing = document.getElementById(
            'fp_email_format_error'
        );
        if (existing) {
            existing.remove();
        }
    }

    function showMessage(input) {
        removeMessage();
        const msg = document.createElement('div');
        msg.id = 'fp_email_format_error';
        msg.style.fontSize = "12px";
        msg.style.color = "#fff";
        msg.style.backgroundColor = "var(--yh-rose)";
        msg.style.border = "1px solid var(--yh-rose)";
        msg.style.borderRadius = "6px";
        msg.style.padding = "12px 16px";
        msg.style.marginBottom = "12px";
        msg.style.lineHeight = "1.5";
        msg.innerHTML =
            '<strong>Invalid email format</strong><br>' +
            'Please enter a valid email address (e.g. name@example.com)';
        // Find the full input container
        const container = input.closest('.inputContainer');
        if (container) {
            // Insert ABOVE input container
            container.insertAdjacentElement('beforebegin', msg);
        } else {
            // Fallback
            input.parentNode.insertBefore(msg, input);
        }
    }

    function stopEvent(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        if (event.cancelBubble !== undefined) {
            event.cancelBubble = true;
        }
        if (event.returnValue !== undefined) {
            event.returnValue = false;
        }
        return false;
    }

    function validate(event) {
        const input = getInput();
        if (!input) {
            return true;
        }
        removeMessage();
        const value = (input.value || '').trim();
        // Let Salesforce handle empty field
        if (!value) {
            return true;
        }
        // Invalid email
        if (!isValidEmail(value)) {
            stopEvent(event);
            showMessage(input);
            input.focus();
            return false;
        }
        return true;
    }

    function bind() {
        const input = getInput();
        if (!input) {
            return;
        }
        // Prevent duplicate bindings
        if (document.body.dataset.fpValidationBound === 'true') {
            return;
        }
        document.body.dataset.fpValidationBound = 'true';
        // Intercept button clicks
        document.addEventListener('click', function (event) {
            const target = event.target;
            const button = target.closest('button');
            if (!button) {
                return;
            }
            const text = (
                button.innerText || ''
            ).trim().toLowerCase();
            if (
                text.includes('reset password') ||
                text.includes('log in')
            ) {
                validate(event);
            }
        }, true);
        // Intercept Enter key
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                validate(event);
            }
        }, true);
        // Intercept form submit
        document.addEventListener('submit', function (event) {
            validate(event);
        }, true);
    }
    // Experience Cloud renders asynchronously
    setInterval(bind, 500);
})();
</script>
