<template>
 
    <div>
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12">
                <template if:true={propertyTypePicklistValue.data}>
                    <lightning-combobox
                    required
                    disabled={disableAction}
                    class="validate"
                    name="propertyType"
                    data-name="propertyType"
                    label="Property Type"
                    value={_record.propertyType}
                    placeholder="Select Property Type"
                    options={propertyTypePicklistValue.data.values}
                    onchange={handleChange}
                    ></lightning-combobox>
                </template>
            </lightning-layout-item>
            <template lwc:if={isInternal}>
                <lightning-layout-item size="12">
                    <c-record-lookup
                    class="validate"
                    filter-ids={_filterPropertyIds}
                    label="Internal Property"
                    placeholder="Search Property"
                    selected-icon-name="standard:household" 
                    required
                    object-label="Property"
                    object-api-name="YH_Property__c"
                    field-api-name="Name"
                    other-field-api-name="Address__Street__s,Address__City__s,Address__CountryCode__s,Address__PostalCode__s"
                    search-field-api-name="Name,Address__Street__s,Address__City__s,Address__PostalCode__s"
                    sort-by-field="LastModifiedDate DESC"
                    onvalueselected={handlePropertyChange}
                    help-text="Search Property by name, street, city and postcode"
                    ></c-record-lookup>
                </lightning-layout-item>
                <template lwc:if={_record.propertyId}>
                    <lightning-layout-item size="12">
                        <label class="slds-form-element__label slds-m-top_small">
                            <b>Current Tenant(s)</b>
                        </label>
                        <lightning-datatable
                        key-field="id"
                        data={propertyMembers}
                        columns={columns}
                        hide-checkbox-column
                        >
                        </lightning-datatable>
                    </lightning-layout-item>
                </template>
            </template>
            <template lwc:if={isExternal}>
                <lightning-layout-item size="12">
                    <lightning-input-address
                    class="validate"
                    required
                    show-address-lookup
                    address-lookup-placeholder="Search Address"
                    address-label="External Address"
                    street-label="Street"
                    street-placeholder="Street"
                    city-label="City"
                    city-placeholder="City"
                    province-label="County"
                    province-placeholder="County"
                    country-label="Country"
                    country-placeholder="Country"
                    country="United Kingdom"
                    postal-code-label="Postal Code"
                    postal-code-placeholder="Postal Code"
                    onchange={handleAddressChange} ></lightning-input-address>
                </lightning-layout-item>
                <lightning-layout-item size="12">
                    <lightning-input 
                    class="validate"
                    type="text" 
                    name="ExternalLandlord" 
                    data-name="propertyLandlord"
                    label="External Landlord"
                    value={_record.propertyLandlord}
                    onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12">
                    <label class="slds-form-element__label slds-m-top_small">
                        <span style="color:red">*</span>
                        <b>Applicants</b>
                    </label>
                    <ol class="slds-list_ordered contact-list">
                        <template for:each={applicants} for:item="applicant">
                            <li key={applicant.id} class="slds-m-vertical_small slds-m-left_none">
                                
                                <lightning-layout>
                                    <lightning-layout-item size="6" >
                                        <c-record-lookup
                                        class="validate"
                                        label="Search Applicant"
                                        placeholder="Search Applicant"
                                        hide-label
                                        selected-icon-name="standard:contact"
                                        required
                                        data-id={applicant.id}
                                        object-label="Contact"
                                        object-api-name="Contact"
                                        field-api-name="Name"
                                        other-field-api-name="Email,MobilePhone"
                                        search-field-api-name="Name"
                                        sort-by-field="LastModifiedDate DESC"
                                        onvalueselected={handleContactChange}
                                        help-text="Search Contact by name"
                                        ></c-record-lookup>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="4" padding="horizontal-small">
                                        <template if:true={propertyTypePicklistValue.data}>
                                            <lightning-combobox
                                            class="validate"
                                            required
                                            name="tenantType"
                                            data-id={applicant.id}
                                            data-name="TenantType__c"
                                            label="Tenant Type"
                                            value={applicant.TenantType__c}
                                            placeholder="Select Tenant Type"
                                            options={tenantTypePicklistValue.data.values}
                                            onchange={handleTenantTypeChange}
                                            variant="label-hidden"
                                            ></lightning-combobox>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="1" >
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            disabled={applicant.disableDelete}
                                            data-id={applicant.id}
                                            onclick={handleApplicantDelete}
                                        ></lightning-button-icon>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="1" >
                                        <lightning-button-icon
                                            icon-name="utility:add"
                                            data-id={applicant.id}
                                            onclick={handleApplicantAdd}
                                        ></lightning-button-icon>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </li>
                        </template>
                    </ol>
                </lightning-layout-item>
            </template>                
        </lightning-layout>
    </div>    
</template>
