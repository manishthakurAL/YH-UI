<template>
    <template lwc:if={_isLoading}>
        <lightning-spinner
            alternative-text="Loading..."
            variant="brand"
        ></lightning-spinner>
    </template>
    <lightning-card title="Compose Letter"> 

        <template lwc:if={_error}>
            <div class="slds-theme_error slds-p-around_x-small">
                <lightning-icon icon-name="utility:error" variant="inverse" size="small"></lightning-icon>
                <span class="slds-p-around_xx-small"><b>An error occurred:</b>&nbsp;&nbsp;{_error.body.message}</span>
            </div>
        </template>

        <template lwc:if={showCategoryOptions}>
            <lightning-combobox 
                label="Category"
                value={_selectedCategory}
                placeholder="Select Category"
                options={categoryOptions}
                onchange={handleOnCategoryChange}
            ></lightning-combobox>
        </template>
        <lightning-combobox 
            label="Letter Type" 
            options={_templateOptions}
            value={_selectedCongaTemplateKey}
            onchange={handleOnLetterTypeChange}
        ></lightning-combobox>

        <template if:true={hasLetterTemplateSelected} >

            <template if:true={enabledLiveEditOnSelectedTemplate} >
                <div class="slds-p-top_x-small" >
                    <lightning-input-rich-text
                        label="Letter Content"
                        label-visible
                        formats="font, size, bold, italic, underline, strike,
                        list, indent, align, link, table, image, clean, code, code-block, color, background, header"
                        value={letterContent}
                        onchange={handleChangeContentEdit}>
                    </lightning-input-rich-text>
                </div>
            </template>
            <template if:false={enabledLiveEditOnSelectedTemplate} >
                <div class="slds-p-top_medium" >
                    <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_dark" role="status">
                        <div class="slds-media__body">
                            <p>
                                Live Edit is not available for this template, please continue with save / post (i.e. merge and attached the document to the case).
                            </p>
                        </div>
                    </div>
                </div>
            </template>
        </template>
        

        <div align="center" class="slds-p-top_medium buttondiv" >

            
            <template lwc:if={eSignEnabled}>
                <div class="button">
                    <lightning-button 
                        variant="brand" 
                        name="CONGA_DOCU_SIGN_ACTION" 
                        label="Send for E-Signature"
                        disabled={disableActionButtons}
                        onclick={handleSaveAndSend}
                    ></lightning-button>
                </div>
                <template lwc:if={inPersonSigningEnabled}>
                    <div class="button">
                        <lightning-button 
                            variant="brand" 
                            name="CONGA_DOCU_SIGN_INPERSON_ACTION" 
                            label="E-Signature (In-Person Signing)"
                            disabled={disableActionButtons}
                            onclick={handleSaveAndSend}
                        ></lightning-button>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <div class="button">
                    <lightning-button 
                        variant="brand" 
                        name="savedraft" 
                        label="Save as Draft"
                        disabled={disableActionButtons}
                        onclick={handleSaveAsDraft}
                    ></lightning-button>
                </div>
                <div class="button">
                    <lightning-button 
                        variant="brand" 
                        name="CONGA_SAVE_ACTION" 
                        label="Save a Copy"
                        disabled={disableActionButtons}
                        onclick={handleSaveAndSend}
                    ></lightning-button>
                </div>
                <div class="button">
                    <lightning-button 
                        variant="brand" 
                        name="CONGA_POST_ACTION" 
                        label="Save and Post"
                        disabled={disableActionButtons}
                        onclick={handleSaveAndSend}
                    ></lightning-button>
                </div>
            </template>
            

            <div class="button">
                <lightning-button 
                    variant="brand" 
                    name="Cancel" 
                    label="Cancel"
                    disabled={disableActionButtons}
                    onclick={handleCancel}
                ></lightning-button>
            </div>                    
        </div>
        <!-- <template if:false={hasLetterTemplate} >
            <div class="slds-p-top_medium" >
                <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_dark" role="status">
                    <div class="slds-media__body">
                        <p>
                            No templates to display.
                        </p>
                    </div>
                </div>
            </div>
        </template> -->
    </lightning-card>
</template>
