<template>
    <section class="panel-card open-cases-card">
        <h3 class="panel-title">My Open Cases</h3>

        <template lwc:if={hasCases}>
            <template for:each={cases} for:item="caseItem">
                <div class="case-card" key={caseItem.caseNumber}>
                    <p class="case-meta">{caseItem.caseMeta}</p>
                    <template lwc:if={caseItem.description}>
                        <p class="case-description">{caseItem.description}</p>
                    </template>
                    <p class="case-opened">Opened: {caseItem.formattedOpenedDate}</p>
                    <span class="badge">{caseItem.status}</span>
                </div>
            </template>
        </template>
        <template lwc:else>
            <p class="no-cases">You have no open cases right now.</p>
        </template>

        <button
            type="button"
            class="full-width view-all-button"
            onclick={handleViewAllCases}
        >View all cases</button>
    </section>
</template>
