<template>
    <template lwc:if={isDraggable}>
        <div class={styleClass} draggable="true"
            ondragstart={handleDragStart} ondragover={handleDragOver} ondrop={handleDrop} ondragenter={handleDragEnter}
            ondragleave={handleDragLeave} ondragend={handleDragEnd} data-id="mainDiv">
           <article class="slds-tile slds-tile_board property-info-card" >
                <h3 class="slds-tile__title slds-text-heading_medium slds-hyphenate" title="Anypoint Connectors">
                    {itemTitle}
                </h3>
                <h4  class="slds-text-subtitle slds-text-heading_small slds-truncate" title="Customer Name">
                    {customerNames}
                </h4>
                <div class="slds-tile__detail">
                    <lightning-formatted-rich-text value={itemSubtitle}></lightning-formatted-rich-text>
                </div>
            </article>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-box non-draggable-item dragged-item-Selected slds-clearfix slds-grid slds-p-around_xxx-small" data-id="mainDiv">
            <article class="slds-tile slds-tile_board property-info-card" >
                <h3 class="slds-tile__title slds-text-heading_medium slds-hyphenate" title="Anypoint Connectors">
                    {itemTitle}
                </h3>
                <h4  class="slds-text-subtitle slds-text-heading_small slds-truncate" title="Customer Name">
                    {customerNames}
                </h4>
                <div class="slds-tile__detail">
                    <lightning-formatted-rich-text value={itemSubtitle}></lightning-formatted-rich-text>
                </div>
            </article>
        </div>
    </template>
</template>
